services:
  oracle-snatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: oracle-a1-vm-snatcher:latest
    container_name: oracle-a1-vm-snatcher
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - APP_PASSWORD=${APP_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-8662502307:AAF_5VwOGGK5tyEoEU6ujqcRLZulcgL9dXU}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-5540796673}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-MTU1NjUxMjE2NzUzNTMyMTE4OQ.GQSzlq.SevG7ZyQixzckgTh5v0Py3OcZojDgTg2OKNjlE}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-1562121709044244550}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-1555473890640134237}
      - MAX_ATTEMPTS=${MAX_ATTEMPTS:-1000}
      - TZ=Asia/Jakarta
    volumes:
      - ./app.py:/app/app.py:ro
      - ./templates:/app/templates:ro
      - ./active_config.json:/app/active_config.json
    # Strictly limit container resources to ensure minimal host impact
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
